<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#4a7c2f" />
  <!-- Keep this out of search engines (link-only sharing). Does NOT affect direct
       access — anyone with the URL can still play. -->
  <meta name="robots" content="noindex, nofollow" />
  <title>Triple Town</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Triple Town" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="stat">
        <span class="stat-label">Score</span>
        <span id="score" class="stat-value">0</span>
      </div>
      <button class="stat stat-btn" id="best-stat" title="See all high scores">
        <span class="stat-label">Best 🏆</span>
        <span id="best" class="stat-value">0</span>
      </button>
      <div class="stat">
        <span class="stat-label">Coins</span>
        <span id="coins" class="stat-value">0</span>
      </div>
    </header>

    <section id="goalbar">
      <div class="goal-info">
        <span class="goal-level" id="goal-level">Level 1</span>
        <button class="undo-btn" id="undo-btn" type="button" title="Undo your last move — you earn one each level" disabled>↩<span class="undo-count" id="undo-count">0</span></button>
        <button class="bomb-btn" id="bomb-btn" type="button" title="Bomb — earned on big merges. Arm it (or long-press the held piece), then tap a rock or bear to blow it up." disabled>💣<span class="bomb-count" id="bomb-count">0</span></button>
        <button class="bomb-btn grave-btn" id="grave-btn" type="button" title="Grave bomb — rarer, earned on bigger merges. Arm it, then tap a grave (tombstone) to clear it." disabled>🪦<span class="bomb-count" id="grave-count">0</span></button>
        <button class="bomb-btn zap-btn" id="zap-btn" type="button" title="Zap — the rarest power. Arm it, then tap ANYTHING to delete it." hidden>⚡<span class="bomb-count" id="zap-count">0</span></button>
        <span class="clock" id="clock" hidden>⏱ 2:00</span>
        <span class="goal-target" id="goal-target">20,000 to level 2</span>
      </div>
      <div class="goal-track"><div class="goal-fill" id="goal-fill"></div></div>
    </section>

    <section id="toolbar">
      <span id="version" class="version" title="build version"></span>
      <span class="hint">Tap to place · slots above = storage</span>
      <div id="new-controls">
        <span class="new-label">New</span>
        <button class="size-btn" data-cols="6" data-rows="6" title="New 6×6 game">6×6</button>
        <button class="size-btn" data-cols="7" data-rows="7" title="New 7×7 game">7×7</button>
        <button class="size-btn" data-cols="8" data-rows="8" title="New 8×8 game">8×8</button>
        <button class="size-btn" data-cols="7" data-rows="8" title="New 7×8 game (7 wide, 8 tall)">7×8</button>
      </div>
      <div id="crystal-controls" title="Crystal density — takes effect immediately">
        <span class="new-label">💎</span>
        <button class="crys-btn" data-mult="1" title="Normal crystal rate">1×</button>
        <button class="crys-btn" data-mult="2" title="Twice as many crystals">2×</button>
        <button class="crys-btn" data-mult="3" title="Three times as many crystals">3×</button>
      </div>
      <div id="time-controls" title="Timed mode — applies when you start a new game">
        <span class="new-label">⏱</span>
        <button class="time-btn" data-time="0" title="Endless — no timer (classic)">∞</button>
        <button class="time-btn" data-time="2" title="2-minute timed game">2m</button>
        <button class="time-btn" data-time="5" title="5-minute timed game">5m</button>
      </div>
    </section>

    <main id="board-wrap">
      <div id="board-stack">
        <div id="storage-slots" aria-label="storage"></div>
        <div id="board" role="grid" aria-label="game board"></div>
      </div>
    </main>

    <section id="store">
      <span class="store-label">Store</span>
      <div id="store-items"></div>
    </section>

    <div id="gameover" class="overlay">
      <div class="overlay-card">
        <button class="overlay-close" id="over-close" type="button" aria-label="Close and view your final board">✕</button>
        <h1>Game Over</h1>
        <p class="over-reason">No room left — final score</p>
        <p id="final-score" class="final">0</p>
        <p id="over-level" class="over-level"></p>
        <div class="again-row">
          <button class="size-btn primary" data-cols="6" data-rows="6">6×6</button>
          <button class="size-btn primary" data-cols="7" data-rows="7">7×7</button>
          <button class="size-btn primary" data-cols="8" data-rows="8">8×8</button>
          <button class="size-btn primary" data-cols="7" data-rows="8">7×8</button>
        </div>
        <button class="over-view-btn" id="over-view" type="button">✕ Close &amp; view my board</button>
      </div>
    </div>

    <div id="level-celebrate" class="level-celebrate" aria-hidden="true"></div>
    <div id="zap-celebrate" class="zap-celebrate" aria-hidden="true"></div>

    <div id="crystal-choice" class="overlay">
      <div id="crystal-opts" class="cc-opts"></div>
    </div>

    <div id="scores-modal" class="overlay">
      <div class="overlay-card scores-card">
        <h1>High Scores</h1>
        <div id="scores-tabs" class="scores-tabs"></div>
        <div id="scores-cols" class="scores-cols"></div>
        <div id="scores-snapshot" class="scores-snapshot" hidden></div>
        <button id="scores-close" class="primary-btn">Close</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
